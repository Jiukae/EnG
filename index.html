  --blue: #1cb0f6;    --blue-d: #1899d6;   --blue-l: #ddf4ff;
  --orange: #ff9600;  --orange-d: #e08500; --orange-l: #fff0d9;
  --red: #ff4b4b;     --red-d: #ea2b2b;    --red-l: #ffdfe0;
  --yellow: #ffc800;  --yellow-d: #e5a800; --yellow-l: #fff6cc;
  --purple: #ce82ff;  --purple-d: #a568cc; --purple-l: #f6e8ff;
  --ice: #6cc8f5;

  --bg: #fff8ef;
  --card: #ffffff;
  --text: #3c3c3c;
  --muted: #8b8b8b;
  --line: #ece4d8;

  --radius: 20px;
  --top-h: 58px;
  --nav-h: 70px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "NanumSquare", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
               "Noto Sans KR", "Segoe UI", Roboto, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
  font-size: 16px;
  line-height: 1.45;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  overscroll-behavior-y: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* =========================================================
   앱 레이아웃
   ========================================================= */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}

.topbar {
  position: sticky; top: 0; z-index: 20;
  height: calc(var(--top-h) + var(--safe-t));
  padding: var(--safe-t) 12px 0;
  display: flex; align-items: center; gap: 8px;
  background: rgba(255, 248, 239, 0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
}
.topbar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 40px; padding: 0 12px;
  border: 2px solid var(--line); border-radius: 999px;
  background: var(--card);
  font-weight: 800; font-size: 16px;
  white-space: nowrap;
}
.chip .ico { font-size: 19px; line-height: 1; }
.chip.streak { color: var(--orange); }
.chip.streak.off { color: var(--muted); filter: grayscale(1); }
.chip.coins { color: var(--yellow-d); }
.chip.profile { padding: 0 12px 0 4px; max-width: 150px; min-width: 0; }
.chip.profile .avatar { width: 32px; height: 32px; font-size: 20px; }
.chip.profile .name { overflow: hidden; text-overflow: ellipsis; color: var(--text); font-size: 15px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card);
  font-size: 20px; display: grid; place-items: center; padding: 0;
}

main {
  padding: 16px 16px calc(var(--nav-h) + var(--safe-b) + 24px);
}
.screen { display: none; animation: fadeIn .22s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 하단 탭바 */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 20;
  height: calc(var(--nav-h) + var(--safe-b));
  padding: 6px 8px calc(6px + var(--safe-b));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--card);
  border-top: 2px solid var(--line);
}
.tab {
  border: 2px solid transparent; background: none; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted);
}
.tab .ico { font-size: 25px; line-height: 1; filter: grayscale(.7); opacity: .75; transition: transform .15s; }
.tab.active { color: var(--blue-d); background: var(--blue-l); border-color: #b5e4fb; }
.tab.active .ico { filter: none; opacity: 1; transform: scale(1.1); }
body.no-nav .tabbar, body.no-nav .topbar { display: none; }
body.no-nav main { padding-bottom: calc(24px + var(--safe-b)); }

/* =========================================================
   공통 컴포넌트
   ========================================================= */
.card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
}
.card-title {
  margin: 0 0 12px; font-size: 18px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
}
.card-title .more { margin-left: auto; font-size: 14px; color: var(--blue-d); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
h1.screen-title { font-size: 24px; margin: 4px 0 16px; font-weight: 900; }

.btn {
  --c: var(--green); --cd: var(--green-d); --fg: #fff;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 56px; padding: 12px 18px;
  border: none; border-radius: 16px;
  background: var(--c); color: var(--fg);
  box-shadow: 0 4px 0 var(--cd);
  font-size: 18px; font-weight: 800; letter-spacing: .02em;
  transition: transform .06s, box-shadow .06s, filter .15s;
  user-select: none;
}
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--cd); }
.btn:disabled { --c: #e5e5e5; --cd: #c9c9c9; --fg: #a5a5a5; cursor: not-allowed; }
.btn:disabled:active { transform: none; box-shadow: 0 4px 0 var(--cd); }
.btn.blue   { --c: var(--blue);   --cd: var(--blue-d); }
.btn.orange { --c: var(--orange); --cd: var(--orange-d); }
.btn.red    { --c: var(--red);    --cd: var(--red-d); }
.btn.purple { --c: var(--purple); --cd: var(--purple-d); }
.btn.yellow { --c: var(--yellow); --cd: var(--yellow-d); --fg: #5a4300; }
.btn.ghost  { --c: #fff; --cd: var(--line); --fg: var(--text); border: 2px solid var(--line); }
.btn.white  { --c: #fff; --cd: rgba(0,0,0,.18); --fg: var(--green-d); }
.btn.sm { min-height: 44px; font-size: 15px; border-radius: 12px; padding: 8px 14px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; font-size: 26px; flex: none;
  background: var(--yellow-l); border: 2px solid #ffe58a;
}

.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 800;
  background: var(--blue-l); color: var(--blue-d);
}
.badge.green { background: var(--green-l); color: var(--green-d); }
.badge.gray { background: #eee; color: var(--muted); }
.badge.orange { background: var(--orange-l); color: var(--orange-d); }

.empty {
  text-align: center; padding: 26px 12px; color: var(--muted);
}
.empty .big { font-size: 44px; display: block; margin-bottom: 6px; }

/* 리스트 */
.list { list-style: none; margin: 0; padding: 0; }
.list li {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 2px; border-bottom: 2px solid #f4efe7;
}
.list li:last-child { border-bottom: none; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 800; }

/* =========================================================
   홈
   ========================================================= */
.hello { display: flex; align-items: flex-end; gap: 10px; margin: 4px 0 16px; }
.mascot { font-size: 58px; line-height: 1; animation: bob 2.4s ease-in-out infinite; flex: none; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
.bubble {
  position: relative; flex: 1;
  background: var(--card); border: 2px solid var(--line); border-radius: 18px;
  padding: 12px 14px; font-weight: 700; margin-bottom: 14px;
}
.bubble::before {
  content: ""; position: absolute; left: -9px; bottom: 14px;
  width: 14px; height: 14px; background: var(--card);
  border-left: 2px solid var(--line); border-bottom: 2px solid var(--line);
  transform: rotate(45deg);
}
.bubble b { color: var(--green-d); }

.lesson-card {
  background: linear-gradient(160deg, #6ee012 0%, var(--green) 55%, #4fbf00 100%);
  border: none; color: #fff; position: relative; overflow: hidden;
  box-shadow: 0 5px 0 var(--green-d);
}
.lesson-card.done {
  background: linear-gradient(160deg, #5fc8ff 0%, var(--blue) 60%, #13a2e6 100%);
  box-shadow: 0 5px 0 var(--blue-d);
}
.lesson-card .deco {
  position: absolute; right: -8px; top: -6px; font-size: 96px; opacity: .25;
  transform: rotate(12deg); pointer-events: none;
}
.lesson-card .day { font-size: 14px; font-weight: 800; opacity: .9; letter-spacing: .06em; }
.lesson-card .topic { font-size: 28px; font-weight: 900; margin: 2px 0 4px; }
.lesson-card .meta { font-size: 14px; font-weight: 700; opacity: .92; margin-bottom: 16px; }

.streak-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.flame { font-size: 52px; line-height: 1; animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
.flame.off { filter: grayscale(1); opacity: .45; animation: none; }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08) rotate(2deg); } }
.streak-num { font-size: 36px; font-weight: 900; color: var(--orange); line-height: 1; }
.streak-num small { font-size: 18px; margin-left: 2px; }
.streak-sub { font-size: 14px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.streak-sub span + span::before { content: "·"; margin: 0 6px; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.week .wd { font-size: 12px; font-weight: 800; color: var(--muted); }
.week .dot {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 15px; font-weight: 800;
  background: #f1ece4; color: #b3aa9c; border: 2px solid transparent;
}
.week .dot.done { background: var(--orange); color: #fff; font-size: 18px; box-shadow: 0 3px 0 var(--orange-d); }
.week .dot.protected { background: var(--ice); color: #fff; font-size: 18px; box-shadow: 0 3px 0 #3fa9dc; }
.week .dot.today { border: 2px dashed var(--orange); background: var(--orange-l); color: var(--orange-d); }
.week .dot.before { opacity: .4; }
.week .d.is-today .wd { color: var(--orange-d); }

.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.quick {
  border: 2px solid var(--line); border-radius: var(--radius); background: var(--card);
  padding: 14px; text-align: left; box-shadow: 0 4px 0 var(--line);
  display: flex; flex-direction: column; gap: 4px;
  transition: transform .06s, box-shadow .06s;
}
.quick:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.quick .ico { font-size: 30px; }
.quick .t { font-weight: 800; }
.quick .s { font-size: 13px; color: var(--muted); font-weight: 600; }

/* 디버그 패널 */
.debug {
  border: 2px dashed #b9a7ff; background: #f6f2ff; border-radius: 16px;
  padding: 12px; margin-bottom: 16px;
}
.debug .head { font-size: 13px; font-weight: 800; color: #7a5ce6; margin-bottom: 8px; }
.debug .now { font-size: 14px; margin-bottom: 10px; }
.debug .btn-row .btn { white-space: nowrap; font-size: 15px; padding: 8px 10px; }
.debug .btn-row .btn:first-child { flex: 1.5; }
.debug .now b { font-family: ui-monospace, Menlo, monospace; }

/* =========================================================
   게임 / 기록 / 설정
   ========================================================= */
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.game {
  border: 2px solid var(--line); border-radius: var(--radius); background: var(--card);
  padding: 16px 12px 14px; text-align: center; box-shadow: 0 4px 0 var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;
}
.game .ico { font-size: 42px; line-height: 1.1; }
.game .t { font-weight: 900; font-size: 16px; }
.game .s { font-size: 12px; color: var(--muted); font-weight: 600; min-height: 34px; }
.game .best { font-size: 12px; font-weight: 800; color: var(--purple-d); }
.game .soon { position: absolute; top: 8px; right: 8px; }
.game.locked { opacity: .65; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  border: 2px solid var(--line); border-radius: 16px; padding: 12px;
  display: flex; align-items: center; gap: 10px;
}
.stat .ico { font-size: 28px; }
.stat .v { font-size: 22px; font-weight: 900; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--muted); font-weight: 700; }

.search {
  width: 100%; height: 48px; padding: 0 14px; margin-bottom: 8px;
  border: 2px solid var(--line); border-radius: 14px; background: #fffdf9;
  font-size: 16px; outline: none;
}
.search:focus { border-color: var(--blue); }

.setting-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 2px solid #f4efe7;
}
.setting-row:last-child { border-bottom: none; }
.setting-row .grow { flex: 1; }
.setting-row .label { font-weight: 800; }
.setting-row .desc { font-size: 13px; color: var(--muted); }

.switch { position: relative; width: 54px; height: 32px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px; background: #ddd; transition: background .2s;
}
.switch .track::after {
  content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 3px rgba(0,0,0,.2); transition: transform .2s;
}
.switch input:checked + .track { background: var(--green); }
.switch input:checked + .track::after { transform: translateX(22px); }

/* 프로필(학습자) 선택 */
.profile-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.profile-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 14px; text-align: left;
  border: 2px solid var(--line); border-radius: 18px; background: var(--card);
  box-shadow: 0 4px 0 var(--line);
}
.profile-item:active { transform: translateY(4px); box-shadow: none; }
.profile-item.current { border-color: var(--green); box-shadow: 0 4px 0 var(--green-d); }
.profile-item .avatar { width: 52px; height: 52px; font-size: 30px; }
.profile-item .grow { flex: 1; min-width: 0; }
.profile-item .name { font-weight: 900; font-size: 18px; }
.profile-item .sub { font-size: 13px; color: var(--muted); font-weight: 700; }

.welcome { text-align: center; padding-top: 24px; }
.welcome .mascot { font-size: 84px; display: inline-block; }
.welcome h1 { font-size: 26px; margin: 10px 0 4px; font-weight: 900; }
.avatar-pick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 12px 0 18px; }
.avatar-pick button {
  aspect-ratio: 1; border-radius: 16px; border: 2px solid var(--line); background: var(--card);
  font-size: 26px; padding: 0; display: grid; place-items: center; overflow: hidden;
}
.avatar-pick button.sel { border-color: var(--blue); background: var(--blue-l); transform: scale(1.06); }
.field-label { display: block; text-align: left; font-weight: 800; margin-bottom: 6px; }
.text-input {
  width: 100%; height: 56px; padding: 0 16px; margin-bottom: 18px;
  border: 2px solid var(--line); border-radius: 16px; background: #fff;
  font-size: 18px; font-weight: 700; outline: none;
}
.text-input:focus { border-color: var(--blue); }

/* =========================================================
   모달 / 토스트
   ========================================================= */
.modal-back {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(40, 30, 20, .45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn .15s ease;
}
.modal {
  width: 100%; max-width: 480px;
  background: var(--card); border-radius: 24px 24px 0 0;
  padding: 22px 18px calc(18px + var(--safe-b));
  animation: slideUp .22s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
.modal .m-ico { font-size: 46px; text-align: center; }
.modal h2 { text-align: center; margin: 6px 0 6px; font-size: 21px; font-weight: 900; }
.modal p { text-align: center; color: #666; margin: 0 0 20px; white-space: pre-line; }
.modal .btn + .btn { margin-top: 12px; }

.toast {
  position: fixed; left: 50%; z-index: 120;
  bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
  transform: translateX(-50%) translateY(20px);
  background: #3c3c3c; color: #fff; padding: 12px 18px; border-radius: 14px;
  font-weight: 700; font-size: 15px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* =========================================================
   레슨 소개
   ========================================================= */
.lesson-head { text-align: center; margin: 4px 0 18px; }
.lesson-head .big-emoji { font-size: 76px; line-height: 1.1; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
.lesson-head .day { font-weight: 800; color: var(--green-d); font-size: 14px; letter-spacing: .06em; margin-top: 6px; }
.lesson-head h1 { margin: 2px 0 4px; font-size: 30px; font-weight: 900; }
.lesson-head p { margin: 0; color: var(--muted); font-weight: 700; }
.done-note {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  padding: 12px 14px; border-radius: 16px; background: var(--green-l); color: var(--green-d); font-weight: 800;
}
.done-note .ico { font-size: 26px; }

.word-row { cursor: pointer; }
.word-row .w-emoji { font-size: 30px; width: 40px; text-align: center; flex: none; }
.word-row .en { font-weight: 900; font-size: 18px; }
.speak-btn {
  width: 44px; height: 44px; border-radius: 12px; flex: none; padding: 0;
  border: 2px solid #b5e4fb; background: var(--blue-l); box-shadow: 0 3px 0 #b5e4fb;
  font-size: 20px; display: grid; place-items: center;
}
.speak-btn:active { transform: translateY(3px); box-shadow: none; }

/* =========================================================
   레슨 진행
   ========================================================= */
.play { min-height: calc(100vh - 40px); min-height: calc(100dvh - 40px); display: flex; flex-direction: column; }
.play-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.close-btn {
  width: 40px; height: 40px; border: none; background: none; padding: 0;
  font-size: 26px; font-weight: 900; color: #b5ab9d; flex: none;
}
.progress { flex: 1; height: 18px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress > i {
  display: block; height: 100%; background: var(--green); border-radius: 999px;
  transition: width .4s ease; position: relative;
}
.progress > i::after {
  content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px;
  border-radius: 999px; background: rgba(255, 255, 255, .35);
}
.q-type {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
  font-size: 13px; font-weight: 800; color: var(--purple-d); background: var(--purple-l);
}
.q-type.retry { color: var(--orange-d); background: var(--orange-l); }
.q-title { font-size: 22px; font-weight: 900; margin: 10px 0 18px; }
.q-body { flex: 1; }
.locked .opt, .locked .block, .locked .bank { pointer-events: none; }

.word-card {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 22px 16px; margin-bottom: 22px; text-align: center;
  border: 2px solid var(--line); border-radius: 22px; background: var(--card);
}
.word-card .en { font-size: 36px; font-weight: 900; }
.word-card .ko { font-size: 30px; font-weight: 900; }
.word-card .emoji { font-size: 52px; line-height: 1; }

.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  min-height: 72px; padding: 12px 10px; text-align: center;
  border: 2px solid var(--line); border-radius: 18px; background: var(--card);
  box-shadow: 0 4px 0 var(--line);
  font-size: 19px; font-weight: 800;
  transition: transform .06s, box-shadow .06s;
}
.opt:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.opt.sel { border-color: #84d8ff; background: var(--blue-l); color: var(--blue-d); box-shadow: 0 4px 0 #84d8ff; }
.opt.right { border-color: var(--green); background: var(--green-l); color: var(--green-d); box-shadow: 0 4px 0 var(--green); animation: pop .45s ease; }
.opt.wrong { border-color: var(--red); background: var(--red-l); color: var(--red-d); box-shadow: 0 4px 0 var(--red); animation: shake .4s ease; }
.opt.dim { opacity: .45; }

.listen-box { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin: 6px 0 28px; }
.big-speaker, .slow-speaker {
  border: none; background: var(--blue); color: #fff; padding: 0;
  display: grid; place-items: center;
}

// 개발용: 레슨 데이터 검사 (문장 속 핵심 단어가 실제로 들어 있는지 등)
function validateLessons() {
  const problems = [];
  LESSONS.forEach(l => {
    if (l.words.length < 4) problems.push(`${l.id} 단어가 4개 미만`);
    if (l.sentences.length < 4) problems.push(`${l.id} 문장이 4개 미만`);
    l.sentences.forEach(s => {
      if (!wordRegex(s.w).test(s.en)) problems.push(`${l.id} "${s.en}" 안에 "${s.w}" 없음`);
      if (!l.words.some(w => w.en === s.w)) problems.push(`${l.id} "${s.w}" 가 단어 목록에 없음`);
    });
  });
  if (problems.length) console.warn('레슨 데이터 확인 필요:\n' + problems.join('\n'));
  return problems;
}

function wordRegex(word) {
  return new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
}

/* =========================================================
   날짜 유틸 (모든 날짜는 Asia/Seoul 기준 'YYYY-MM-DD' 문자열)
   ========================================================= */
const DateUtil = {
  _fmt: new Intl.DateTimeFormat('en-US', {
    timeZone: CONFIG.TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit',
  }),

  // 실제 한국 날짜 (디버그 오프셋 미적용)
  realToday() {
    const parts = {};
    for (const p of this._fmt.formatToParts(new Date())) parts[p.type] = p.value;
    return `${parts.year}-${parts.month}-${parts.day}`;
  },

  // 앱이 사용하는 "오늘" (디버그 오프셋 적용)
  today() {
    return this.addDays(this.realToday(), App.meta.debug.dayOffset || 0);
  },

  toUTC(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  },

  fromUTC(ms) {
    const dt = new Date(ms);
    const y = dt.getUTCFullYear();
    const m = String(dt.getUTCMonth() + 1).padStart(2, '0');
    const d = String(dt.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  },

  addDays(dateStr, n) {
    return this.fromUTC(this.toUTC(dateStr) + n * 86400000);
  },

  // b - a (일 단위)
  diffDays(a, b) {
    return Math.round((this.toUTC(b) - this.toUTC(a)) / 86400000);
  },

  weekday(dateStr) {
    return new Date(this.toUTC(dateStr)).getUTCDay();
  },

  label(dateStr) {
    const [, m, d] = dateStr.split('-').map(Number);
    return `${m}월 ${d}일 (${WEEKDAYS_KO[this.weekday(dateStr)]})`;
  },
};

/* =========================================================
   저장소 (localStorage)

   eng:meta              → 앱 전체 정보 (학습자 목록, 현재 학습자, 디버그 설정)
   eng:profile:<id>      → 학습자별 데이터 (스트릭, 코인, 학습 기록, 단어장, 구매 내역, 게임 점수)
   ========================================================= */
const Store = {
  memory: {},   // localStorage 를 쓸 수 없을 때(사생활 보호 모드 등) 임시 저장
  available: (() => {
    try {
      const k = '__eng_test__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })(),

  key(...parts) { return [CONFIG.STORAGE_PREFIX, ...parts].join(':'); },

  read(key) {
    try {
      const raw = this.available ? localStorage.getItem(key) : this.memory[key];
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      console.warn('저장 데이터를 읽지 못했어요:', key, e);
      return null;
    }
  },

  write(key, value) {
    const raw = JSON.stringify(value);
    try {
      if (this.available) localStorage.setItem(key, raw);
      else this.memory[key] = raw;
    } catch (e) {
      console.warn('저장에 실패했어요:', key, e);
      toast('저장 공간이 부족해서 기록을 저장하지 못했어요');
    }
  },

  remove(key) {
    try {
      if (this.available) localStorage.removeItem(key);
      else delete this.memory[key];
    } catch (e) { /* 무시 */ }
  },

  // 앱(eng:) 키를 모두 삭제
  clearAll() {
    const prefix = CONFIG.STORAGE_PREFIX + ':';
    if (this.available) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
    } else {
      this.memory = {};
    }
  },
};

    words: {},                     // { 'apple': { en, ko, lessonId, firstDate, seen, correct } }
    purchases: [],                 // [{ item, cost, date, at }]

// 저장된 값에 빠진 필드를 기본값으로 채움 (나중에 필드가 추가돼도 기존 기록이 깨지지 않도록)
function withDefaults(saved, defaults) {
  if (saved === null || typeof saved !== 'object' || Array.isArray(saved)) return defaults;
  const out = { ...saved };
  for (const [k, v] of Object.entries(defaults)) {
    if (!(k in out)) out[k] = v;
    else if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length) {
      out[k] = withDefaults(out[k], v);
    }
  }
  return out;
}

const App = {
  meta: null,       // eng:meta
  data: null,       // 현재 학습자 데이터
  screen: 'home',

  init() {
    this.meta = withDefaults(Store.read(Store.key('meta')), defaultMeta());
    // 순서 목록과 실제 학습자 목록 맞추기
    this.meta.profileOrder = this.meta.profileOrder.filter(id => this.meta.profiles[id]);
    for (const id of Object.keys(this.meta.profiles)) {
      if (!this.meta.profileOrder.includes(id)) this.meta.profileOrder.push(id);
    }
    if (!this.meta.profiles[this.meta.activeProfileId]) {
      this.meta.activeProfileId = this.meta.profileOrder[0] || null;
    }
    this.saveMeta();
    if (this.meta.activeProfileId) this.loadProfile(this.meta.activeProfileId);
  },

  saveMeta() { Store.write(Store.key('meta'), this.meta); },

  get profile() { return this.meta.profiles[this.meta.activeProfileId] || null; },

  readProfileData(id) {
    return withDefaults(Store.read(Store.key('profile', id)), defaultProfileData(DateUtil.today()));
  },

  loadProfile(id) {
    this.data = this.readProfileData(id);
    Store.write(Store.key('profile', id), this.data);
  },

  save() {
    if (this.meta.activeProfileId && this.data) {
      Store.write(Store.key('profile', this.meta.activeProfileId), this.data);
    }
  },

  createProfile(name, avatar) {
    const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    this.meta.profiles[id] = { id, name, avatar, createdAt: new Date().toISOString() };
    this.meta.profileOrder.push(id);
    this.meta.activeProfileId = id;
    this.saveMeta();
    this.data = defaultProfileData(DateUtil.today());
    this.save();
    return id;
  },

  switchProfile(id) {
    if (!this.meta.profiles[id]) return;
    this.meta.activeProfileId = id;
    this.saveMeta();
    this.loadProfile(id);
  },

  deleteProfile(id) {
    delete this.meta.profiles[id];
    this.meta.profileOrder = this.meta.profileOrder.filter(x => x !== id);
    Store.remove(Store.key('profile', id));
    if (this.meta.activeProfileId === id) {
      this.meta.activeProfileId = this.meta.profileOrder[0] || null;
      this.data = null;
      if (this.meta.activeProfileId) this.loadProfile(this.meta.activeProfileId);
    }
    this.saveMeta();
  },

  // 현재 학습자 기록만 초기화 (이름·아바타는 유지)
  resetCurrentProfile() {
    this.data = defaultProfileData(DateUtil.today());
    this.save();
  },

  // 모든 학습자와 기록 삭제
  resetAll() {
    Store.clearAll();
    this.meta = defaultMeta();
    this.data = null;
    this.saveMeta();
  },

  /* ---- 공통 데이터 조작 (다음 단계에서 사용) ---- */

  addCoins(amount, reason) {
    this.data.coins = Math.max(0, this.data.coins + amount);
    this.data.coinLog.unshift({ date: DateUtil.today(), amount, reason, at: Date.now() });
    this.data.coinLog.length = Math.min(this.data.coinLog.length, CONFIG.COIN_LOG_LIMIT);
    this.save();
  },

  spendCoins(amount, reason) {
    if (this.data.coins < amount) return false;
    this.addCoins(-amount, reason);
    return true;
  },

  // 레슨 결과 저장: 오늘 첫 완료면 학습 기록에 남기고, 단어장은 복습 때도 갱신
  recordLesson(r) {
    const d = this.data;
    if (!r.practice && !d.history[r.date]) {
      d.history[r.date] = {
        lessonId: r.lesson.id, day: r.day,
        correct: r.result.correct, total: r.result.total,
        coins: 0, at: Date.now(),
      };
    }
    for (const w of r.lesson.words) {
      const hit = r.wordHits[w.en] || { right: 0, wrong: 0 };
      const cur = d.words[w.en] || {
        en: w.en, lessonId: r.lesson.id, firstDate: r.date, seen: 0, right: 0, wrong: 0,
      };
      Object.assign(cur, { ko: w.ko, e: w.e, lastDate: r.date });
      cur.seen++;
      cur.right += hit.right;
      cur.wrong += hit.wrong;
      d.words[w.en] = cur;
    }
    this.save();
  },

  /* ---- 계산값 ---- */

  // 오늘이 학습 시작일로부터 며칠째인지 (1부터)
  dayNumber(date = DateUtil.today()) {
    return Math.max(1, DateUtil.diffDays(this.data.startDate, date) + 1);
  },

  // 날짜에 배정된 레슨 (순서대로, 다 쓰면 처음부터 순환)
  lessonFor(date = DateUtil.today()) {
    if (!LESSONS.length) return null;
    return LESSONS[(this.dayNumber(date) - 1) % LESSONS.length];
  },

  isDoneOn(date) { return !!this.data.history[date]; },
  isProtectedOn(date) { return this.data.streak.protectedDates.includes(date); },
};

function esc(s) {

    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);

// 확인 창: confirmModal({...}).then(ok => ...)
function confirmModal({ icon = '❓', title, message = '', okText = '확인', cancelText = '취소', danger = false }) {
  $('#toast').classList.remove('show');
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <div class="m-ico">${icon}</div>
        <h2 id="m-title">${esc(title)}</h2>
        <p>${esc(message)}</p>
        <button class="btn ${danger ? 'red' : ''}" data-m="ok">${esc(okText)}</button>
        <button class="btn ghost" data-m="cancel">${esc(cancelText)}</button>
      </div>`;
    const close = ok => { back.remove(); resolve(ok); };
    back.addEventListener('click', e => {
      if (e.target === back) return close(false);
      const b = e.target.closest('[data-m]');
      if (b) close(b.dataset.m === 'ok');
    });
    document.body.appendChild(back);
    $('[data-m="cancel"]', back).focus();
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

const reducedMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// 정답 시 반짝이 효과
function confetti() {
  if (reducedMotion) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const items = ['⭐', '✨', '🎉', '💚', '🌟'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    const ang = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 90;
    s.textContent = items[i % items.length];
    s.style.setProperty('--x', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--y', Math.sin(ang) * dist - 30 + 'px');
    s.style.setProperty('--r', Math.round(Math.random() * 360 - 180) + 'deg');
    s.style.animationDelay = Math.random() * 0.08 + 's';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1100);
}

/* =========================================================
   발음 (브라우저 내장 speechSynthesis, en-US)
   ========================================================= */
const Speech = {
  ok: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined',
  voice: null,

  init() {
    if (!this.ok) return;
    const choose = () => { this.voice = this.pickVoice(); };
    choose();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', choose);
    else speechSynthesis.onvoiceschanged = choose;
  },

  pickVoice() {
    const us = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    const preferred = ['Samantha', 'Google US English', 'Microsoft Jenny', 'Microsoft Aria', 'Allison', 'Ava', 'Alex'];
    for (const name of preferred) {
      const v = us.find(x => x.name.includes(name));
      if (v) return v;
    }
    return us.find(v => v.localService) || us[0] || null;
  },

  // el 을 주면 읽는 동안 .speaking 효과를 줍니다
  speak(text, { slow = false, el = null } = {}) {
    if (!this.ok || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      if (this.voice) u.voice = this.voice;
      u.rate = slow ? 0.55 : 0.9;
      if (el) {
        el.classList.add('speaking');
        u.onend = u.onerror = () => el.classList.remove('speaking');
      }
      speechSynthesis.speak(u);
    } catch (e) { /* 음성 실패는 무시 */ }
  },

  stop() {
    if (this.ok) try { speechSynthesis.cancel(); } catch (e) { /* 무시 */ }
  },
};

/* =========================================================
   효과음 (Web Audio 로 직접 합성 → 외부 파일 불필요)
   ========================================================= */
const Sfx = {
  ctx: null,
  tunes: {
    good: [[523.25, 0, 0.12], [783.99, 0.1, 0.26]],
    bad:  [[311.13, 0, 0.16], [233.08, 0.14, 0.32]],
    done: [[523.25, 0, 0.12], [659.25, 0.12, 0.24], [783.99, 0.24, 0.36], [1046.5, 0.36, 0.6]],
  },

  play(kind) {
    if (!App.meta.settings.sfx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = this.ctx || new AC();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const t0 = this.ctx.currentTime;
      for (const [freq, start, end] of this.tunes[kind]) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = kind === 'bad' ? 'triangle' : 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0 + start);
        gain.gain.exponentialRampToValueAtTime(0.22, t0 + start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + end);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t0 + start);
        osc.stop(t0 + end + 0.02);
      }
    } catch (e) { /* 효과음 실패는 무시 */ }
  },
};

const NO_NAV_SCREENS = ['welcome', 'play'];

function go(name) {
  if (location.hash === '#' + name) route();
  else location.hash = name;
}

function route() {
  let name = location.hash.slice(1) || 'home';
  if (!Screens[name]) name = 'home';
  if (!App.profile && name !== 'welcome') name = 'welcome';
  if (App.profile && name === 'welcome' && !App.addingProfile) name = 'home';
  if (name === 'play' && !Lesson.run) name = 'lesson';

  // 레슨을 푸는 도중에 다른 화면으로 나가려 하면(✕ 버튼, 뒤로 가기) 먼저 물어봄
  if (App.screen === 'play' && name !== 'play' && Lesson.inProgress()) {
    askQuitLesson();
    return;
  }
  if (name !== 'play') Lesson.run = null;

  App.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.to === name));
  document.body.classList.toggle('no-nav', NO_NAV_SCREENS.includes(name));
  render();
  window.scrollTo(0, 0);
}

let quitAsking = false;
async function askQuitLesson() {
  const target = location.hash.slice(1) || 'home';
  history.replaceState(null, '', '#play');
  if (quitAsking) return;
  quitAsking = true;
  const ok = await confirmModal({
    icon: '🥺', title: '레슨을 그만둘까요?',
    message: '지금 나가면 오늘 푼 문제가 저장되지 않아요.',
    okText: '그만하기', cancelText: '계속 풀기', danger: true,
  });
  quitAsking = false;
  if (!ok) return;
  Lesson.abort();
  go(target);
}

function render() {
  if (App.profile) renderTopbar();
  Screens[App.screen].render($('#screen-' + App.screen));
}

// 최근 7일 달력
function renderWeek(today) {
  const cells = [];
  for (let i = 6; i >= 0; i--) {
    const date = DateUtil.addDays(today, -i);
    const isToday = i === 0;
    let cls = '', inner = Number(date.slice(8));
    if (App.isDoneOn(date)) { cls = 'done'; inner = '🔥'; }
    else if (App.isProtectedOn(date)) { cls = 'protected'; inner = '🧊'; }
    else if (isToday) cls = 'today';
    else if (date < App.data.startDate) cls = 'before';
    cells.push(`
      <div class="d ${isToday ? 'is-today' : ''}">
        <span class="wd">${isToday ? '오늘' : WEEKDAYS_KO[DateUtil.weekday(date)]}</span>
        <span class="dot ${cls}" title="${date}">${inner}</span>
      </div>`);
  }
  return `<div class="week" aria-label="최근 7일 학습 기록">${cells.join('')}</div>`;
}

  blank:   { ico: '✏️', label: '빈칸 채우기' },
};
const VOCAB_PLAN = ['en2ko', 'en2ko', 'ko2en', 'ko2en', 'listen', 'listen'];   // 단어마다 1문제
const SENTENCE_PLAN = ['arrange', 'arrange', 'blank', 'blank'];                 // 문장마다 1문제
const CHEERS = ['정답이에요!', '훌륭해요!', '완벽해요!', '멋져요!', '잘했어요!', '최고예요!'];

function lessonSize(l) {
  return Math.min(VOCAB_PLAN.length, l.words.length) + Math.min(SENTENCE_PLAN.length, l.sentences.length);
}

function tokenize(sentence) {
  return sentence.replace(/[.,!?]/g, '').split(/\s+/).filter(Boolean);
}

function buildQuestions(l) {
  const words = shuffle(l.words);
  const vocab = VOCAB_PLAN.slice(0, words.length).map((type, i) => ({
    // 음성을 지원하지 않는 브라우저에서는 듣기 문제를 다른 단어 문제로 바꿈
    type: type === 'listen' && !Speech.ok ? (i % 2 ? 'ko2en' : 'en2ko') : type,
    word: words[i],
  }));

  // 문장 만들기에는 짧은 문장(7단어 이하)을 우선 사용
  const sents = shuffle(l.sentences);
  const arrange = sents.filter(s => tokenize(s.en).length <= 7).slice(0, 2);
  const rest = sents.filter(s => !arrange.includes(s));
  while (arrange.length < 2 && rest.length) arrange.push(rest.shift());
  const sentenceQs = [
    ...arrange.map(sentence => ({ type: 'arrange', sentence })),
    ...rest.slice(0, 2).map(sentence => ({ type: 'blank', sentence })),
  ];

  // 같은 유형이 연달아 나오지 않게 섞기
  let qs = [...vocab, ...sentenceQs];
  for (let t = 0; t < 80; t++) {
    const c = shuffle(qs);
    if (c.every((q, i) => i === 0 || q.type !== c[i - 1].type)) { qs = c; break; }
    if (t === 79) qs = c;
  }
  return qs.map((q, id) => prepareQuestion({ ...q, id }, l));
}

// 문제에 보기/블록 등을 채워 넣음 (오답 재출제 때도 다시 섞기 위해 호출)
function prepareQuestion(q, l) {
  if (q.type === 'arrange') {
    const answer = tokenize(q.sentence.en);
    const used = new Set(answer.map(t => t.toLowerCase()));
    const extras = [];
    for (const t of shuffle(l.sentences.flatMap(s => tokenize(s.en)))) {
      if (extras.length >= 2) break;
      if (!used.has(t.toLowerCase())) { used.add(t.toLowerCase()); extras.push(t); }
    }
    return { ...q, answer, blocks: shuffle([...answer, ...extras]), placed: [] };
  }
  if (q.type === 'blank') {
    const word = l.words.find(w => w.en === q.sentence.w);
    const m = q.sentence.en.match(wordRegex(word.en));
    return {
      ...q, word, selected: null, options: wordOptions(word, l),
      before: q.sentence.en.slice(0, m.index), gapText: m[0], after: q.sentence.en.slice(m.index + m[0].length),
    };
  }
  return { ...q, selected: null, options: wordOptions(q.word, l) };
}

// 보기 4개: 정답 + 같은 레슨의 다른 단어 (부족하면 다른 레슨에서), 뜻이 겹치는 보기는 제외
function wordOptions(answer, l) {
  const opts = [answer];
  const pools = [shuffle(l.words), shuffle(LESSONS.flatMap(x => x.words))];
  for (const pool of pools) {
    for (const w of pool) {
      if (opts.length >= 4) break;
      if (!opts.some(o => o.en === w.en || o.ko === w.ko)) opts.push(w);
    }
  }
  return shuffle(opts);
}

/* =========================================================
   레슨 진행
   ========================================================= */
const Lesson = {
  run: null,

  start() {
    const date = DateUtil.today();
    const l = App.lessonFor(date);
    const queue = buildQuestions(l);
    this.run = {
      lesson: l, date, day: App.dayNumber(date),
      practice: App.isDoneOn(date),   // 오늘 이미 완료했다면 복습
      queue, pos: 0, total: queue.length,
      solved: 0,                      // 맞혀서 끝낸 문제 수 (진행 막대)
      firstTry: {},                   // { 문제 id: 첫 시도에 맞혔는지 } → 정답률
      wordHits: {},                   // { 단어: { right, wrong } } → 단어장 통계
      state: 'answer',                // answer → feedback → … → done
      lastOk: null, cheer: '', shownPct: 0, startedAt: Date.now(),
    };
    $('#toast').classList.remove('show');   // 남은 알림이 확인 버튼을 가리지 않게
    go('play');
    this.autoSpeak();
  },

  inProgress() { return !!this.run && this.run.state !== 'done'; },

  get q() { return this.run.queue[this.run.pos]; },

  autoSpeak() {
    const q = this.q;
    if (!App.meta.settings.autoSpeak || !q) return;
    if (q.type === 'en2ko' || q.type === 'listen') {
      Speech.speak(q.word.en, { el: $('#screen-play .big-speaker') || $('#screen-play .word-card .speak-btn') });
    }
  },

  canCheck() {
    const q = this.q;
    return q.type === 'arrange' ? q.placed.length > 0 : q.selected !== null;
  },

  pickOption(i) {
    if (this.run.state !== 'answer') return;
    const q = this.q;
    q.selected = i;
    // 영어 보기는 누르면 읽어 줌 (듣기 문제는 정답 힌트가 되므로 제외)
    if ((q.type === 'ko2en' || q.type === 'blank') && App.meta.settings.autoSpeak) Speech.speak(q.options[i].en);
    render();
  },

  place(i) {
    const q = this.q;
    if (this.run.state !== 'answer' || q.placed.includes(i)) return;
    q.placed.push(i);
    if (App.meta.settings.autoSpeak) Speech.speak(q.blocks[i]);
    render();
  },

  unplace(k) {
    if (this.run.state !== 'answer') return;
    this.q.placed.splice(k, 1);
    render();
  },

  check() {
    const r = this.run, q = this.q;
    if (r.state !== 'answer' || !this.canCheck()) return;
    const ok = q.type === 'arrange'
      ? q.placed.map(i => q.blocks[i]).join(' ').toLowerCase() === q.answer.join(' ').toLowerCase()
      : q.options[q.selected].en === q.word.en;

    if (!(q.id in r.firstTry)) r.firstTry[q.id] = ok;
    const key = q.word ? q.word.en : q.sentence.w;
    const hit = r.wordHits[key] = r.wordHits[key] || { right: 0, wrong: 0 };
    hit[ok ? 'right' : 'wrong']++;

    if (ok) r.solved++;
    else r.queue.push({ ...prepareQuestion({ id: q.id, type: q.type, word: q.word, sentence: q.sentence }, r.lesson), retry: true });

    r.state = 'feedback';
    r.lastOk = ok;
    r.cheer = pick(CHEERS);
    Sfx.play(ok ? 'good' : 'bad');
    if (ok) confetti();
    render();
    if (App.meta.settings.autoSpeak) {
      if (q.type === 'arrange' || q.type === 'blank') Speech.speak(q.sentence.en);
      else if (q.type === 'ko2en') Speech.speak(q.word.en);
    }
  },

  next() {
    const r = this.run;
    if (r.state !== 'feedback') return;
    r.pos++;
    if (r.pos >= r.queue.length) return this.finish();
    r.state = 'answer';
    render();
    window.scrollTo(0, 0);
    this.autoSpeak();
  },

  finish() {
    const r = this.run;
    const ids = Object.keys(r.firstTry);
    r.result = {
      correct: ids.filter(id => r.firstTry[id]).length,
      total: ids.length,
      ms: Date.now() - r.startedAt,
    };
    r.state = 'done';
    App.recordLesson(r);
    Speech.stop();
    Sfx.play('done');
    render();
    window.scrollTo(0, 0);
    if (r.result.correct === r.result.total) confetti();
  },

  abort() {
    this.run = null;
    Speech.stop();
  },
};

Screens.play = {
  render(el) {
    const r = Lesson.run;
    if (!r) return;
    if (r.state === 'done') return this.renderDone(el, r);

    const q = Lesson.q;
    const t = Q_TYPES[q.type];
    const fb = r.state === 'feedback';
    const pct = Math.round(r.solved / r.total * 100);
    el.innerHTML = `
      <div class="play ${fb ? 'has-feedback' : ''}">
        <div class="play-top">
          <button class="close-btn" data-action="quit-lesson" aria-label="레슨 그만하기">✕</button>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">
            <i style="width:${r.shownPct}%"></i>
          </div>
        </div>
        <div class="q-body ${fb ? 'locked' : ''}">
          <span class="q-type ${q.retry ? 'retry' : ''}">${q.retry ? '🔁 다시 도전!' : `${t.ico} ${t.label}`}</span>
          ${this[q.type](q, fb)}
        </div>
        <div class="play-foot">
          <button class="btn" data-action="check-answer" ${Lesson.canCheck() ? '' : 'disabled'}>확인</button>
        </div>
      </div>
      ${fb ? this.feedback(q, r) : ''}`;

    // 진행 막대가 이전 위치에서 늘어나도록
    const bar = $('.progress > i', el);
    void bar.offsetWidth;
    bar.style.width = pct + '%';
    r.shownPct = pct;
  },

  // 1. 영어 단어 → 뜻 고르기
  en2ko(q) {
    return `
      <div class="q-title">이 단어의 뜻은 무엇일까요?</div>
      <div class="word-card">
        <span class="en">${esc(q.word.en)}</span>
        <button class="speak-btn" data-action="speak" data-text="${esc(q.word.en)}" aria-label="발음 듣기">🔊</button>
      </div>
      ${this.options(q, o => esc(o.ko))}`;
  },

  // 2. 뜻 → 영어 단어 고르기
  ko2en(q) {
    return `
      <div class="q-title">영어로 무엇일까요?</div>
      <div class="word-card">
        <span class="emoji" aria-hidden="true">${q.word.e || ''}</span><span class="ko">${esc(q.word.ko)}</span>
      </div>
      ${this.options(q, o => esc(o.en))}`;
  },

  // 3. 듣고 맞는 단어 고르기
  listen(q) {
    return `
      <div class="q-title">잘 듣고 알맞은 단어를 고르세요</div>
      <div class="listen-box">
        <button class="big-speaker" data-action="speak" data-text="${esc(q.word.en)}" aria-label="듣기">🔊</button>
        <button class="slow-speaker" data-action="speak" data-slow="1" data-text="${esc(q.word.en)}" aria-label="천천히 듣기">🐢</button>
      </div>
      ${this.options(q, o => esc(o.en))}`;
  },

  // 4. 단어 블록을 순서대로 배열해 문장 완성
  arrange(q, fb) {
    const zone = fb ? (Lesson.run.lastOk ? 'right' : 'wrong') : '';
    return `
      <div class="q-title">이 문장을 영어로 만들어 보세요</div>
      <div class="ko-sentence">
        <div class="mascot" aria-hidden="true">🐣</div>
        <div class="bubble">${esc(q.sentence.ko)}</div>
      </div>
      <div class="answer-zone ${zone}" aria-label="내 답">
        ${q.placed.map((bi, k) => `<button class="block" data-action="unplace-block" data-k="${k}">${esc(q.blocks[bi])}</button>`).join('')}
      </div>
      <div class="bank" aria-label="단어 블록">
        ${q.blocks.map((b, i) => `<button class="block ${q.placed.includes(i) ? 'used' : ''}" data-action="place-block" data-i="${i}">${esc(b)}</button>`).join('')}
      </div>`;
  },

  // 5. 빈칸 채우기
  blank(q, fb) {
    let gap = '&nbsp;', cls = '';
    if (q.selected !== null) {
      const w = q.options[q.selected].en;
      gap = esc(q.before ? w : w[0].toUpperCase() + w.slice(1));   // 문장 맨 앞이면 대문자로
      if (fb) cls = Lesson.run.lastOk ? 'right' : 'wrong';
    }
    return `
      <div class="q-title">빈칸에 알맞은 단어를 고르세요</div>
      <div class="blank-sentence">${esc(q.before)}<span class="gap ${cls}">${gap}</span>${esc(q.after)}</div>
      <div class="blank-ko">${esc(q.sentence.ko)}</div>
      ${this.options(q, o => esc(o.en))}`;
  },

  options(q, label) {
    const fb = Lesson.run.state === 'feedback';
    return `<div class="options">${q.options.map((o, i) => {
      let cls = '';
      if (fb) cls = o.en === q.word.en ? 'right' : i === q.selected ? 'wrong' : 'dim';
      else if (i === q.selected) cls = 'sel';
      return `<button class="opt ${cls}" data-action="pick-option" data-i="${i}">${label(o)}</button>`;
    }).join('')}</div>`;
  },

  feedback(q, r) {
    const ok = r.lastOk;
    const isSentence = q.type === 'arrange' || q.type === 'blank';
    const text = isSentence ? q.sentence.en : q.word.en;
    const speakBtn = `<button class="speak-btn fb-speak" data-action="speak" data-text="${esc(text)}" aria-label="발음 듣기">🔊</button>`;
    const ans = isSentence
      ? `<div class="ans">${esc(q.sentence.en)}${speakBtn}</div><div class="sub">${esc(q.sentence.ko)}</div>`
      : `<div class="ans">${esc(q.word.en)} = ${esc(q.word.ko)}${speakBtn}</div>`;
    return `
      <div class="feedback ${ok ? 'good' : 'bad'}" role="alert">
        <div class="fb-head"><span class="fb-ico">${ok ? '🎉' : '😅'}</span>${ok ? r.cheer : '아쉬워요!'}</div>
        <div class="fb-body">
          ${ok ? '' : '<div class="sub">정답은</div>'}
          ${ans}
          ${ok ? '' : '<div class="sub" style="margin-top:6px">🔁 이 문제는 마지막에 한 번 더 나와요</div>'}
        </div>
        <button class="btn ${ok ? '' : 'red'}" data-action="next-question">계속</button>
      </div>`;
  },

  renderDone(el, r) {
    const { correct, total } = r.result;
    const rate = Math.round(correct / total * 100);
    const perfect = correct === total;
    el.innerHTML = `
      <div class="finish">
        <div class="trophy" aria-hidden="true">${perfect ? '🏆' : '🎉'}</div>
        <h1>${r.practice ? '복습 완료!' : '레슨 완료!'}</h1>
        <p class="sub">Day ${r.day} · ${r.lesson.emoji} ${esc(r.lesson.topic)}${perfect ? ' · 만점이에요!' : ''}</p>
        <div class="result-grid">
          <div class="result-box" style="--c:var(--green)"><div class="h">정답률</div><div class="v">${rate}%</div></div>
          <div class="result-box" style="--c:var(--blue)"><div class="h">첫 시도에 맞힌 문제</div><div class="v">${correct}/${total}</div></div>
        </div>
        <div class="card">
          <div class="card-title" style="justify-content:center">📚 오늘 배운 단어</div>
          <div class="chips">${r.lesson.words.map(w => `
            <button class="word-chip" data-action="speak" data-text="${esc(w.en)}">${w.e || ''} ${esc(w.en)}<small>${esc(w.ko)}</small></button>`).join('')}
          </div>
        </div>
        <button class="btn" data-action="go" data-to="home">홈으로</button>
      </div>`;
  },
};

        <div class="card-title">👤 학습자</div>
        <div class="setting-row">
          <span class="avatar">${p.avatar}</span>
          <div class="grow"><div class="label">${esc(p.name)}</div>
          <div class="desc">시작일 ${esc(DateUtil.label(App.data.startDate))}</div></div>
        </div>
        <button class="btn blue sm" data-action="go" data-to="profiles">학습자 바꾸기 / 추가</button>
      </div>

      <div class="card">
        <div class="card-title">🔊 소리</div>
        <div class="setting-row">
          <div class="grow"><div class="label">효과음</div><div class="desc">정답·오답 소리를 들려줘요</div></div>
          <label class="switch"><input type="checkbox" data-setting="sfx" ${App.meta.settings.sfx ? 'checked' : ''}><span class="track"></span></label>
        </div>
        <div class="setting-row">
          <div class="grow"><div class="label">발음 자동 재생</div><div class="desc">문제가 나오면 영어 발음을 바로 들려줘요</div></div>
          <label class="switch"><input type="checkbox" data-setting="autoSpeak" ${App.meta.settings.autoSpeak ? 'checked' : ''}><span class="track"></span></label>
        </div>
        <div class="setting-row">
          <div class="grow"><div class="label">발음 테스트</div>
          <div class="desc">${Speech.ok
            ? esc(Speech.voice ? `음성: ${Speech.voice.name}` : '기본 영어(미국) 음성')
            : '⚠️ 이 브라우저는 음성 기능을 지원하지 않아요'}</div></div>
          <button class="speak-btn" data-action="speak" data-text="Hello! Nice to meet you." aria-label="발음 테스트" ${Speech.ok ? '' : 'disabled'}>🔊</button>
        </div>
      </div>

      ${CONFIG.DEBUG_TOOLS ? `
      <div class="card">
        <div class="card-title">🛠 개발자 도구</div>
        <div class="setting-row">
          <div class="grow"><div class="label">디버그 도구 보이기</div>
          <div class="desc">홈 화면에 '날짜 하루 넘기기' 버튼을 표시해요</div></div>
          <label class="switch"><input type="checkbox" id="debug-toggle" ${App.meta.debug.showPanel ? 'checked' : ''}><span class="track"></span></label>
        </div>
        <div class="setting-row">
          <div class="grow"><div class="label">앱 날짜</div>
          <div class="desc">${DateUtil.today()} (실제 날짜 ${DateUtil.realToday()}, 한국 시간)</div></div>
        </div>
      </div>` : ''}

      <div class="card">
        <div class="card-title">🗑 데이터 초기화</div>
        <p class="small muted" style="margin-top:0">초기화한 기록은 되돌릴 수 없어요.</p>
        <button class="btn orange sm" data-action="reset-profile">${esc(p.name)}의 기록 초기화</button>
        <div style="height:12px"></div>
        <button class="btn red sm" data-action="reset-all">모든 데이터 삭제</button>
      </div>

      <p class="small muted" style="text-align:center">
        삐약 영어 · 데이터는 이 기기의 브라우저에만 저장돼요${Store.available ? '' : '<br>⚠️ 저장소를 쓸 수 없어 창을 닫으면 기록이 사라져요'}
      </p>`;

    const t = $('#debug-toggle', el);
    if (t) t.addEventListener('change', () => {
      App.meta.debug.showPanel = t.checked;
      App.saveMeta();
      toast(t.checked ? '디버그 도구를 표시해요' : '디버그 도구를 숨겼어요');
    });
  },
};

/* ---------- 학습자 선택 ---------- */
Screens.profiles = {
  render(el) {
    const ids = App.meta.profileOrder;
    el.innerHTML = `
      <h1 class="screen-title">👨‍👩‍👧 누가 공부하나요?</h1>
      <div class="profile-list">
        ${ids.map(id => {
          const p = App.meta.profiles[id];
          const d = id === App.meta.activeProfileId ? App.data : App.readProfileData(id);
          const cur = id === App.meta.activeProfileId;
          return `
            <button class="profile-item ${cur ? 'current' : ''}" data-action="switch-profile" data-id="${id}">
              <span class="avatar">${p.avatar}</span>
              <div class="grow"><div class="name">${esc(p.name)}</div>
              <div class="sub">🔥 ${d.streak.current}일 · 🪙 ${d.coins} · 📚 ${Object.keys(d.words).length}단어</div></div>
              ${cur ? '<span class="badge green">학습 중</span>' : ''}
            </button>`;
        }).join('')}
      </div>
      <button class="btn blue" data-action="add-profile">＋ 학습자 추가</button>
      ${ids.length > 1 ? `
        <div style="height:24px"></div>
        <div class="card">
          <div class="card-title">학습자 삭제</div>
          <ul class="list">${ids.map(id => `
            <li><span class="avatar">${App.meta.profiles[id].avatar}</span>
            <div class="grow title">${esc(App.meta.profiles[id].name)}</div>
            <button class="btn ghost sm" style="width:auto" data-action="delete-profile" data-id="${id}">삭제</button></li>`).join('')}
          </ul>
        </div>` : ''}`;
  },
};

/* ---------- 처음 시작 / 학습자 추가 ---------- */
Screens.welcome = {
  avatar: AVATARS[0],

  render(el) {
    const adding = !!App.profile;
    el.innerHTML = `
      <div class="welcome">
        <div class="mascot">🐣</div>
        <h1>${adding ? '새 학습자 추가' : '삐약 영어에 오신 걸 환영해요!'}</h1>
        <p class="muted" style="margin:0 0 20px">매일 한 레슨, 불꽃을 키우고 코인으로 게임해요</p>
        <div class="card" style="text-align:left">
          <label class="field-label" for="name-input">이름</label>
          <input class="text-input" id="name-input" maxlength="10" placeholder="예: 지우" autocomplete="off">
          <span class="field-label">캐릭터 고르기</span>
          <div class="avatar-pick">
            ${AVATARS.map(a => `<button type="button" class="${a === this.avatar ? 'sel' : ''}" data-action="pick-avatar" data-avatar="${a}">${a}</button>`).join('')}
          </div>
          <button class="btn" data-action="create-profile">시작하기</button>
          ${adding ? `<div style="height:12px"></div><button class="btn ghost" data-action="cancel-add">취소</button>` : ''}
        </div>
      </div>`;
  },
};

/* =========================================================
   액션 (data-action 이벤트 위임)
   ========================================================= */
const Actions = {
  go(el) { go(el.dataset.to); },

  speak(el) {
    const target = el.matches('button') ? el : $('.speak-btn', el);
    Speech.speak(el.dataset.text, { slow: !!el.dataset.slow, el: target });
  },

  'start-lesson'() { Lesson.start(); },
  'quit-lesson'() { go('lesson'); },
  'pick-option'(el) { Lesson.pickOption(Number(el.dataset.i)); },
  'place-block'(el) { Lesson.place(Number(el.dataset.i)); },
  'unplace-block'(el) { Lesson.unplace(Number(el.dataset.k)); },
  'check-answer'() { Lesson.check(); },
  'next-question'() { Lesson.next(); },

  'pick-avatar'(el) {
    Screens.welcome.avatar = el.dataset.avatar;
    document.querySelectorAll('.avatar-pick button').forEach(b => b.classList.toggle('sel', b === el));
  },

  'create-profile'() {
    const input = $('#name-input');
    const name = input.value.trim();
    if (!name) { toast('이름을 입력해 주세요'); input.focus(); return; }
    App.createProfile(name, Screens.welcome.avatar);
    App.addingProfile = false;
    toast(`${name}님, 환영해요! 🎉`);
    go('home');
  },

  'add-profile'() {
    App.addingProfile = true;
    Screens.welcome.avatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
    go('welcome');
  },

  'cancel-add'() {
    App.addingProfile = false;
    go('profiles');
  },

  'switch-profile'(el) {
    App.switchProfile(el.dataset.id);
    toast(`${App.profile.name}님으로 바꿨어요`);
    go('home');
  },

  async 'delete-profile'(el) {
    const p = App.meta.profiles[el.dataset.id];
    const ok = await confirmModal({
      icon: '🗑', title: `${p.name}을(를) 삭제할까요?`,
      message: '이 학습자의 스트릭, 코인, 단어장이 모두 사라지고\n되돌릴 수 없어요.',
      okText: '삭제하기', danger: true,
    });
    if (!ok) return;
    App.deleteProfile(p.id);
    toast('학습자를 삭제했어요');
    route();
  },

  async 'reset-profile'() {
    const ok = await confirmModal({
      icon: '⚠️', title: '기록을 초기화할까요?',
      message: `${App.profile.name}의 스트릭, 코인, 학습 기록,\n단어장, 구매 내역, 게임 점수가 모두 지워져요.\n되돌릴 수 없어요.`,
      okText: '초기화하기', danger: true,
    });
    if (!ok) return;
    App.resetCurrentProfile();
    toast('기록을 초기화했어요');
    go('home');
  },

  async 'reset-all'() {
    const ok = await confirmModal({
      icon: '🚨', title: '모든 데이터를 삭제할까요?',
      message: '모든 학습자와 기록이 이 기기에서 지워져요.\n되돌릴 수 없어요.',
      okText: '전부 삭제하기', danger: true,
    });
    if (!ok) return;
    App.resetAll();
    go('welcome');
  },

  'debug-next-day'() {
    App.meta.debug.dayOffset += 1;
    App.saveMeta();
    onDayChanged();
    toast(`⏭ 하루 넘겼어요 · ${DateUtil.label(DateUtil.today())}`);
  },

  'debug-reset-day'() {
    App.meta.debug.dayOffset = 0;
    App.saveMeta();
    onDayChanged();
    toast('실제 날짜로 돌아왔어요');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.action];
  if (fn) fn(el, e);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'name-input') Actions['create-profile']();
});

// 설정 스위치 (data-setting="키")
document.addEventListener('change', e => {
  const key = e.target.dataset && e.target.dataset.setting;
  if (!key) return;
  App.meta.settings[key] = e.target.checked;
  App.saveMeta();
});

/* =========================================================
   날짜 변경 감지
   ========================================================= */
let lastSeenDate = null;

// 날짜가 바뀌었을 때(자정이 지났거나 디버그로 넘겼을 때) 호출 — 스트릭 판정은 3단계에서 연결
function onDayChanged() {
  lastSeenDate = DateUtil.today();
  if (App.profile && App.screen !== 'play') render();   // 문제 푸는 중에는 화면을 건드리지 않음
}

function checkDayChange() {
  if (DateUtil.today() !== lastSeenDate) onDayChanged();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkDayChange();
});
setInterval(checkDayChange, 60 * 1000);

/* =========================================================
   시작
   ========================================================= */
App.init();
Speech.init();
if (CONFIG.DEBUG_TOOLS) validateLessons();
lastSeenDate = DateUtil.today();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
